name: Publish to gh-pages
# gh-pages is a mirror of main. Moving the branch pointer through the API takes
# seconds; cloning the repository to force-push it took over ten minutes because
# of the course videos.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Point gh-pages at this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/gh-pages" -f sha="${{ github.sha }}" -F force=true --silent && echo "gh-pages -> ${{ github.sha }}"
