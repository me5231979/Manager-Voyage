name: Fetch one audio sample
# Downloads a single Runway clip into assets/audio/foundation so it can be
# checked before a full media build. Write {"name","url"} to .github/sample-url.json and push to main.
on:
  push:
    branches: [main]
    paths: ['.github/sample-url.json']
permissions:
  contents: write
concurrency:
  group: media-build
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Download
        run: |
          set -e
          name=$(python3 -c "import json;print(json.load(open('.github/sample-url.json'))['name'])")
          url=$(python3 -c "import json;print(json.load(open('.github/sample-url.json'))['url'])")
          case "$name" in *[!A-Za-z0-9-]*) echo "bad name"; exit 1;; esac
          curl -fsSL -o "assets/audio/foundation/$name.mp3" "$url"
          ls -la "assets/audio/foundation/$name.mp3"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/audio/foundation
          git commit -m "Add audio sample $(python3 -c "import json;print(json.load(open('.github/sample-url.json'))['name'])")" || exit 0
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
