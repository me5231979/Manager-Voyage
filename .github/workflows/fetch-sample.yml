name: Fetch one audio sample
# Downloads a single Runway clip into assets/audio/foundation so it can be
# checked before a full media build. Write [{"name","url"}, ...] to .github/sample-url.json and push to main.
on:
  push:
    branches: [main]
    paths: ['.github/sample-url.json']
permissions:
  contents: write
concurrency:
  group: media-build
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Download
        run: |
          set -e
          python3 - <<'PY'
          import json, re, subprocess
          d = json.load(open('.github/sample-url.json'))
          items = d if isinstance(d, list) else [d]
          for it in items:
              assert re.fullmatch(r'[A-Za-z0-9-]+', it['name']), it['name']
              subprocess.run(['curl', '-fsSL', '-o', 'assets/audio/foundation/%s.mp3' % it['name'], it['url']], check=True)
              print('fetched', it['name'])
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/audio/foundation
          git commit -m "Add audio samples from sample-url.json" || exit 0
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
      - name: Publish to the live site
        run: git push origin HEAD:gh-pages
