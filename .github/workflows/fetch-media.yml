name: Fetch images
# Downloads generated images into assets/img/<dir>, resizes them to web size
# (webp, max 1600px wide), and publishes. Write [{"name","url","dir"?}, ...]
# to .github/media-url.json and push to main, or run it by hand.
on:
  push:
    branches: [main]
    paths: ['.github/media-url.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: media-build
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Download and resize
        run: |
          set -e
          pip install -q pillow
          python3 - <<'PY'
          import json, os, re, subprocess
          from PIL import Image
          d = json.load(open('.github/media-url.json'))
          items = d if isinstance(d, list) else [d]
          for it in items:
              assert re.fullmatch(r'[A-Za-z0-9-]+', it['name']), it['name']
              sub = it.get('dir', 'foundation'); assert re.fullmatch(r'[a-z0-9-]+', sub), sub
              os.makedirs('assets/img/' + sub, exist_ok=True)
              raw = '/tmp/%s.raw' % it['name']
              subprocess.run(['curl', '-fsSL', '-o', raw, it['url']], check=True)
              im = Image.open(raw).convert('RGB')
              w = int(it.get('width', 1600))
              if im.width > w: im = im.resize((w, round(im.height * w / im.width)), Image.LANCZOS)
              out = 'assets/img/%s/%s.webp' % (sub, it['name'])
              im.save(out, 'WEBP', quality=int(it.get('quality', 84)), method=6)
              print('fetched', out, im.size, os.path.getsize(out))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/img
          git commit -m "Add images from media-url.json" || exit 0
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
      - name: Publish to the live site
        run: git push origin HEAD:gh-pages
